<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"><title>Golf Game</title></head>
<body>
<header><b>🏌️ Golf Game</b><button id="install" hidden>Install</button></header>
<main>
<section id="home">
<h1>Golf Game</h1>
<div class="card"><h2>New Game</h2>
<label>Game ID<input id="gameId" placeholder="Enter Game ID" maxlength="30" autocomplete="off"></label>
<label>Admin<input id="admin" placeholder="Name" autocomplete="name"></label>
<label>Course<select id="course"></select></label>
<label>Players</label><div id="countBtns" class="choice"></div>
<div id="playerNames"></div>
<button id="create">Start</button>
</div>
<div class="card"><h2>Join Game</h2>
<label>Game ID<input id="mid" placeholder="Game ID" autocomplete="off"></label>
<label>Name<input id="name" placeholder="Name" autocomplete="name"></label>
<button id="join">Join</button></div>
<div class="card"><h2>Courses</h2><button id="courses">Open</button></div>
</section>

<section id="coursePage" hidden><button class="back">‹ Back</button><h2>Courses</h2>
<div class="card"><h3 id="courseFormTitle">Add Course</h3>
<label>Course Name<input id="cname" placeholder="Course name"></label>
<div class="tablewrap"><div class="coursehead"><b>Hole</b><b>PAR</b><b>SI</b></div><div id="holes"></div></div>
<button id="saveCourse">Save</button><button id="cancelEdit" class="secondary" hidden>Cancel</button></div>
<div class="card"><h3>Saved Courses</h3><div id="saved"></div></div></section>

<section id="matchPage" hidden><button class="back">‹ Home</button>
<div class="card"><h2 id="matchId"></h2><div id="courseName"></div></div>
<div class="hole"><button id="prev">‹</button><div><b>HOLE <span id="hole">1</span> / 18</b><div id="parsi">PAR — · SI —</div></div><button id="next">›</button></div>
<div class="card"><h3>Players</h3><div id="players"></div></div>
<div class="card"><h3>My Score</h3><div id="mine"></div></div>
<div class="card"><h3>Hole Scores</h3><div id="scores"></div></div>
</section>
</main><div id="toast"></div>
<script>window.GOLF_API_URL="https://script.google.com/macros/s/AKfycbx23o-76M9HLC2NpjTLOpjBYnYZ8KCq49lkMKHRiftlKdcG8wwOwVElpd6Y9UDHym58/exec";</script>
<script src="app.js?v=4"></script></body></html>
